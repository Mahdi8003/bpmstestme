<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b131b" />
    <meta
      name="description"
      content="روند؛ سیستم مدیریت پرونده و گردش کار برای کسب‌وکارهای ایرانی"
    />
    <title>روند | مدیریت پرونده‌ها</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="application-name" content="روند" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="روند" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        window.__ravandPwaPrompt = event;
        window.dispatchEvent(new Event('ravand:install-available'));
      });
    </script>
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('ravand-theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (error) {
          /* no storage available: fall back to the light theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
